name: Publish 0.1.8 lab candidate

on:
  push:
    branches: [main]
    paths:
      - "RELEASES/0.1.8.md"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts,tests -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }

      - name: Build and validate Debug ARM64 CMD installer
        shell: pwsh
        run: ./scripts/Build.ps1 -Configuration Debug -TestSign

      - name: Build and validate Release ARM64 package
        shell: pwsh
        run: ./scripts/Build.ps1 -Configuration Release -TestSign

      - name: Package CMD installer
        shell: pwsh
        run: |
          $zip = "Rpi5Display-0.1.8-CMD-Installer.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "out/ARM64/Debug/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.8"
          $title = "Rpi5Display 0.1.8 (Lab Candidate)"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag Rpi5Display-0.1.8-CMD-Installer.zip SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed." }
            gh release edit $tag --title $title --notes-file RELEASES/0.1.8.md --prerelease --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Release update failed." }
          } else {
            gh release create $tag Rpi5Display-0.1.8-CMD-Installer.zip SHA256SUMS.txt --target $env:GITHUB_SHA --title $title --notes-file RELEASES/0.1.8.md --prerelease --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed." }
          }
