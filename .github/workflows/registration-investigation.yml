name: Registration investigation
on:
  push:
    branches: [fix/registration-windows11-arm64]
    paths: [.github/workflows/registration-investigation.yml, scripts/inspect_reference.py]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - shell: pwsh
        run: |
          python scripts/inspect_reference.py
          if ($LASTEXITCODE) { throw 'Reference inspection failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: registration-inspection
          path: inspection/
          retention-days: 3
          if-no-files-found: error
